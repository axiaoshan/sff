name: Build iOS SFHook dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # iOS tweak 需要 Apple iPhoneOS SDK，必须用 macOS runner（自带 Xcode）
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select full Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Verify iPhoneOS SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install ldid (required for signing) + dpkg (for deb)
        run: |
          export THEOS="${{ github.workspace }}/theos"
          brew install ldid 2>/dev/null || {
            echo "brew 安装 ldid 失败，改为从 GitHub 下载预编译版本"
            curl -L -o "$THEOS/bin/ldid" "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64"
            chmod +x "$THEOS/bin/ldid"
          }
          ldid 2>&1 | head -1 || true
          brew install dpkg 2>/dev/null || true

      - name: Build
        run: |
          make package || make package FINALPACKAGE=0

      - name: Verify artifacts
        run: |
          echo "=== dylib ==="
          ls -la .theos/obj/debug/arm64/SFHook.dylib
          file .theos/obj/debug/arm64/SFHook.dylib
          echo "=== deb ==="
          ls -la packages/*.deb || echo "(no deb)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFHook-iOS
          path: |
            .theos/obj/debug/arm64/SFHook.dylib
            packages/*.deb
          if-no-files-found: warn
