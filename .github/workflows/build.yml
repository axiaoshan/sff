name: Build iOS SFHook dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # iOS tweak 需要 Apple iPhoneOS SDK，必须用 macOS runner（自带 Xcode）
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select full Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Verify iPhoneOS SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dpkg (for deb packaging)
        run: |
          brew install dpkg || brew install --cask dpkg || true

      - name: Build
        run: make package

      - name: Verify artifacts
        run: |
          echo "=== dylib ==="
          ls -la .theos/obj/debug/arm64/SFHook.dylib
          file .theos/obj/debug/arm64/SFHook.dylib
          echo "=== deb ==="
          ls -la packages/*.deb || echo "(no deb)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFHook-iOS
          path: |
            .theos/obj/debug/arm64/SFHook.dylib
            packages/*.deb
          if-no-files-found: warn
